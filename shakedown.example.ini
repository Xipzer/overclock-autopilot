; Copy to shakedown.ini beside shakedown.exe.

[load]
; The program that loads every core. {seconds} becomes the length asked for with --minutes (1 for a single pass).
command=C:\Tools\Cinebench2026\Cinebench.exe g_CinebenchCpuXTest=true g_CinebenchMinimumTestDuration={seconds}
dir=C:\Tools\Cinebench2026
; Text that comes before the score in what the load prints. Leave empty if it prints none.
score=CB
; A file the load writes when it crashes. When one appears, Shakedown closes the load, so no error dialog waits for a click.
; One * may stand for a folder name.
crashfile=%APPDATA%\Maxon\Cinebench2026_*\_bugreports\_BugReport.txt

[limits]
; Stop the load if the water gets this warm. 0 = no limit.
coolant=45

[coolant]
; Optional water temperature, read from a number another program keeps in the registry (HKEY_CURRENT_USER).
; These are Blackout's: github.com/Xipzer/blackout-tray
key=Software\Blackout
value=Coolant
divide=10

[sensors]
; PawnIO's IntelMSR module, for temperatures and throttling. Default: IntelMSR.bin beside shakedown.exe.
;module=C:\Tools\IntelMSR.bin
